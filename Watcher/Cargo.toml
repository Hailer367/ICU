[package]
name = "ryo-watch"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Event-driven arbitrage watcher for RyoCore on Base"
license = "MIT"

[[bin]]
name = "ryo-watch"
path = "src/main.rs"

[dependencies]
alloy = { version = "2.5.0", features = ["full", "json-rpc"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.31"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
